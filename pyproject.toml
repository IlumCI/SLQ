[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slq"
version = "0.1.0"
description = "Statistically-Lossless Quantization of Large Language Models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SLQ contributors" }]
keywords = ["quantization", "llm", "gptq", "shapley", "mixed-precision"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.4",
  "numpy>=1.24",
  "scipy>=1.11",
]

[project.optional-dependencies]
hf = ["transformers>=4.44", "datasets>=2.20", "safetensors>=0.4", "accelerate>=0.33"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
slq = "slq.cli:main"

[tool.setuptools.packages.find]
include = ["slq*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
